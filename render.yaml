# Render blueprint for the Overlord relay.
#
# This exists so the "Deploy to Render" button in README.md works: Render reads
# this file to learn what to build. The relay is multi-tenant, but a new custom
# deployment accepts only its owner by default. Set OPEN_HOSTING=1 to let other
# streamers register isolated rooms; their viewers consume the operator's bandwidth.
services:
  - type: web
    name: overlord-relay
    runtime: node
    rootDir: relay-server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # Generated in-game: Mod Settings -> Overlord -> Generate, then copy here.
      # Must match the Host secret in Mod Settings exactly or the relay rejects
      # the game (server.js fails closed when this is unset).
      - key: HOST_SECRET
        sync: false
      # From https://dev.twitch.tv/console/apps. Leave it EMPTY for a first run and
      # set ALLOW_GUEST_LOGIN below instead — then viewers join by typing a name and
      # you can skip registering a Twitch application entirely. With neither set,
      # nobody can log in at all (/auth/twitch returns 503).
      - key: TWITCH_CLIENT_ID
        sync: false
      # "1" turns on name-only login. IGNORED whenever TWITCH_CLIENT_ID is set, so
      # filling that in later switches this off by itself — the two can never both be
      # live, which is what stops a guest typing a real viewer's name.
      # Anyone with the URL can join as any name while this is on. Test/private use.
      - key: ALLOW_GUEST_LOGIN
        value: ""
      # "1" lets OTHER streamers press Join in their own Mod Settings and host on
      # this relay, each in their own room. Their viewers use YOUR bandwidth, which
      # is what MAX_TOTAL_VIEWERS bounds. Off by default.
      - key: OPEN_HOSTING
        value: ""
      # Optional: with OPEN_HOSTING on, only people you gave this code to can join.
      - key: HOST_INVITE_CODE
        sync: false
      # Viewers PER GAME.
      - key: MAX_VIEWERS
        value: "50"
      # Games at once.
      - key: MAX_ROOMS
        value: "8"
      # Viewers across the whole relay - the ceiling that actually bounds the bill,
      # because MAX_VIEWERS is per room and multiplies by MAX_ROOMS without it.
      - key: MAX_TOTAL_VIEWERS
        value: "100"
